name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  script:
    name: shellcheck and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck koha-backup.sh tests/live.sh tests/fetch-tools.sh tools/release.sh
      - name: Unit tests (bats, as root)
        run: |
          bash tests/fetch-tools.sh
          sudo tests/.cache/bats-core-1.11.1/bin/bats tests/unit.bats

  readme:
    name: Company introduction matches github.com/kohasolutions/.github/company/about.md
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/sync-about.mjs --check

  secrets:
    name: No secrets committed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks program itself (MIT), pinned and checksum-verified. The gitleaks GitHub Action needs a paid
      # licence for organisations; the scanner does not.
      - name: Scan the whole history for secrets
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose
